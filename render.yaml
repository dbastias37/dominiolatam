# Free service only. No paid disk or database is provisioned.
# Local accounts, chat and rooms are temporary on Render Free.
services:
  - type: web
    name: dominiolatam
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --ignore-scripts && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/dominio.sqlite
      - key: PERSISTENCE_MODE
        value: ephemeral
